[package]
name = "skytrace"
version = "0.1.1"
edition = "2024"
description = "Lightweight desktop live flight tracker (Rust + Slint)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/legendarylolo318-cloud/skytrace"
rust-version = "1.88"

[dependencies]
anyhow = "1"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lru = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
slint = { version = "1.18", features = ["renderer-software"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
toml = "0.9"

[dev-dependencies]
# Headless Slint platform used by the UI tests in src/ui/app.rs.
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
